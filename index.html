<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0e1013" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#e9ebef" media="(prefers-color-scheme: light)" />
    <!--
      Set the theme before the first paint. The store reads the same key and
      the same system preference; this only exists so the reader never sees a
      dark flash on the way to a light page. localStorage is not a network
      request, so PRD §9.1 still holds.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('anatomi-qris:theme');
          var theme =
            stored === 'dark' || stored === 'light'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <meta
      name="description"
      content="Bagaimana sebuah kode QR dibangun, dan apa isi payload QRIS. Semua diproses di perangkat ini."
    />
    <!--
      The mark, inlined so the browser never requests /favicon.ico. A 404 in
      the network tab is still a network request, and PRD §9.1 promises an
      empty one. This is the brand package's 32 px tier: finder only, magenta
      core, because below 32 px the alignment pattern turns to mud.
    -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='14' fill='%23F4F4F6'/%3E%3Crect x='12' y='12' width='62' height='62' fill='none' stroke='%230A0A0C' stroke-width='13'/%3E%3Crect x='35' y='35' width='16' height='16' fill='%23F0328C'/%3E%3C/svg%3E" />
    <!--
      Safari fetches this only when someone adds the app to a home screen, so
      it costs no request on load. Full-bleed paper tile, no transparency, as
      iOS wants.
    -->
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Anatomi QRIS" />

    <!--
      The social card. Crawlers fetch it; the page never does. The URL is
      absolute because that is the only form a crawler can resolve.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Anatomi QRIS" />
    <meta property="og:title" content="Anatomi QRIS — Dibaca modul demi modul" />
    <meta
      property="og:description"
      content="Bagaimana sebuah kode QR dibangun, dan apa isi payload QRIS. Semua diproses di perangkat ini."
    />
    <meta property="og:url" content="https://andifathulms.github.io/anatomi-qris/" />
    <meta
      property="og:image"
      content="https://andifathulms.github.io/anatomi-qris/brand/og.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Anatomi QRIS — dibaca modul demi modul" />
    <meta name="twitter:card" content="summary_large_image" />

    <title>Anatomi QRIS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
