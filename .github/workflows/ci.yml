name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
      # The oracle runs here and blocks deploy: byte-identical agreement with
      # an independent implementation across the full supported matrix.
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Check the bundle budget
        run: node scripts/check-bundle.mjs
